let officeDemoIndex=0,officeDemoAuto=false,officeDemoTimer=null,officeConversationLog=[],officeOffsets={};
function officeLogHtml(){return officeConversationLog.length?officeConversationLog.slice().reverse().map((e,i)=>`<div class="talkRow"><strong>${escapeHtml(e.role)}</strong> · ${escapeHtml(e.msg)}<small>Handoff artifact: ${escapeHtml(e.artifact)} · bước ${e.index}/9 · DEMO ONLY</small></div>`).join(''):'<div class="talkRow">Chưa có hội thoại. Chọn <b>Giao việc 1 bước</b> hoặc <b>Tự chạy mô phỏng</b>.</div>'}
function updateOfficeDemoUI(){const log=document.getElementById('officeLiveEvents');if(log)log.innerHTML=officeLogHtml();const count=document.getElementById('officeDemoCount');if(count)count.textContent=`${officeDemoIndex} / ${officeItinerary.length} handoffs`;const btn=document.getElementById('officeAutoplay');if(btn)btn.textContent=officeDemoAuto?'Ⅱ Tạm dừng':'▶ Tự chạy mô phỏng';const next=document.getElementById('officeNext');if(next)next.disabled=officeDemoIndex>=officeItinerary.length;}
function officeTalkNext(){if(officeDemoIndex>=officeItinerary.length){officeDemoAuto=false;clearTimeout(officeDemoTimer);updateOfficeDemoUI();notify('Đã đi hết lịch trình mô phỏng. Không chạy AI hay ghi dữ liệu thật.');return;}
 const e=officeItinerary[officeDemoIndex];officeDemoIndex++;
 const from=people.find(p=>p.id===e.from),to=people.find(p=>p.id===e.to);
 const dx=to.pos[0]-from.pos[0]-32,dy=to.pos[1]-from.pos[1]+22;
 officeOffsets[e.from]=[dx,dy];const avatar=document.querySelector(`[data-agent="${e.from}"]`);if(avatar){avatar.style.transform=`translate(${dx}px,${dy}px)`;avatar.classList.add('is-traveling');}
 const bubble=document.getElementById('officeBubble');if(bubble){bubble.hidden=false;bubble.innerHTML=`<span class="who">${escapeHtml(e.role)} · Đang trao đổi</span><span class="said">${escapeHtml(e.msg)}</span>`;}
 officeConversationLog.push({...e,index:officeDemoIndex});updateOfficeDemoUI();
 if(officeDemoAuto){officeDemoTimer=setTimeout(()=>{const av=document.querySelector(`[data-agent="${e.from}"]`);if(av)av.classList.remove('is-traveling');officeTalkNext()},2450)}
}
function officeAutoToggle(){officeDemoAuto=!officeDemoAuto;clearTimeout(officeDemoTimer);if(officeDemoAuto){if(officeDemoIndex>=officeItinerary.length)officeReset();officeTalkNext()}else updateOfficeDemoUI();}
function officeReset(){clearTimeout(officeDemoTimer);officeDemoAuto=false;officeDemoIndex=0;officeConversationLog=[];officeOffsets={};document.querySelectorAll('.officeCanvas [data-agent]').forEach(el=>{el.style.transform='translate(0px,0px)';el.classList.remove('is-traveling')});const bubble=document.getElementById('officeBubble');if(bubble){bubble.hidden=true;bubble.textContent='';}updateOfficeDemoUI()}
function officeRestoreAfterRender(){for(const [key,[dx,dy]] of Object.entries(officeOffsets)){const el=document.querySelector(`.officeCanvas [data-agent="${key}"]`);if(el){el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;requestAnimationFrame(()=>{el.style.transition=''})}}updateOfficeDemoUI()}

function toggleDemoPause(){demoPaused=!demoPaused;render();notify(demoPaused?'Tạm dừng mô phỏng.':'Tiếp tục mô phỏng.');}
function resetDemo(){demoIndex=0;demoPaused=false;render();}
function workflowPage(){return head('Workflow Studio · Delivery Pipeline','Từ yêu cầu → /spec → /plan → /cook → /test + SOC + QA → /report. Đây chỉ là mô phỏng không chạy AI.',`<button class="btn" onclick="resetDemo()">↺ Reset demo</button>`)+`<div class="panel" style="padding:19px"><div class="flexWrap" style="justify-content:space-between"><div><div class="eyebrow">SIMULATED RUN · #0007</div><h2 style="margin:5px 0 0;font-size:17px">Software Delivery Workflow</h2><p class="softInfo">${demoIndex} / ${demoNodes.length} bước · ${demoPaused?'Paused':'Demo mode'} · 0 actual API/tool calls</p></div><div class="flexWrap"><button class="btn" onclick="toggleDemoPause()">${demoPaused?'▶ Resume':'Ⅱ Pause'}</button><button class="btn primary" onclick="advanceDemo()" ${demoPaused||demoIndex===demoNodes.length?'disabled':''}>Tiếp tục 1 bước →</button></div></div><div class="flow2grid">${demoNodes.map((n,i)=>`<div class="stepBox ${i<demoIndex?'done':i===demoIndex?'active':''}"><div class="idx">STEP ${String(i+1).padStart(2,'0')} · ${i<demoIndex?'✓ DEMO DONE':i===demoIndex?'◷ CURRENT':'○ PENDING'}</div><div class="stepName">${n.label}</div><div class="stepStatus">${n.owner}</div></div>`).join('')}</div><div class="cols"><div><div class="eyebrow">AGENT CONVERSATION BOARD · MOCK EVENTS</div>${demoNodes.slice(0,demoIndex).map(n=>`<div class="miniMessage"><b>${n.owner}</b><br>${n.event}</div>`).join('')||'<div class="miniMessage">Chưa có sự kiện. Nhấn Tiếp tục 1 bước.</div>'}</div><div><div class="eyebrow">HANDOFF & QUALITY GATES</div><div class="miniMessage"><b>Handoff Packet</b><br>spec_id · plan_id · accepted_decisions · source_refs · changed_files · checksums · next_action</div><div class="miniMessage"><b>Hàng rào chất lượng</b><br>Tester + SOC + QA có evidence, severity và blocker độc lập. Không cho release khi Critical/Block còn mở.</div><div class="miniMessage"><b>Durable checkpoint</b><br>File Store / DB Store lưu steps, events, artifacts, approval. Bản UI demo này chỉ giữ state trong phiên trình duyệt.</div></div></div></div>`}
function knowledgePage(){return head('Knowledge Hub','Canonical decisions, verified facts, documents và history có nguồn gốc.',`<button class="btn primary" onclick="notify('Prototype: chưa có chức năng nhập tài liệu.')">＋ Import source</button>`)+`<div class="stats"><div class="stat"><div><span>INDEXED CHUNKS</span><b>2,184</b></div><span class="emoji">▣</span></div><div class="stat"><div><span>ACCEPTED DECISIONS</span><b>27</b></div><span class="emoji">✓</span></div><div class="stat"><div><span>MEMORY PROPOSALS</span><b>4</b></div><span class="emoji">◷</span></div><div class="stat"><div><span>CONFLICTS</span><b>2</b></div><span class="emoji">⚑</span></div></div><div class="panel"><div class="panelHead"><div><div class="panelTitle">Source of Truth Registry</div><div class="panelHint">Đề xuất và quyết định đã được duyệt tách biệt hoàn toàn</div></div></div><table class="rowTable"><tr><th>ID</th><th>Decision / Fact</th><th>Evidence</th><th>Status</th></tr><tr><td>ADR-012</td><td>Canonical knowledge stored locally</td><td>Architecture v3</td><td><span class="tag">Accepted</span></td></tr><tr><td>ADR-018</td><td>Memory proposals require review</td><td>Product Policy</td><td><span class="tag">Accepted</span></td></tr><tr><td>FACT-044</td><td>New provider fallback route</td><td>Thread #18</td><td><span class="tag warning">Proposed</span></td></tr><tr><td>ADR-003</td><td>Browser-only canonical storage</td><td>Architecture v1</td><td><span class="tag error">Superseded</span></td></tr></table></div>`}
function tasksPage(){return head('Task Management','Mọi tác vụ liên kết thread, agent, context snapshot và artifact.',`<button class="btn primary" onclick="notify('Prototype: chưa có task storage.')">＋ New task</button>`)+tableTasks()+`<div class="notice" style="margin-top:14px">Task lifecycle: Draft → Queued → Working → Review → Verified / Failed / Blocked. Không đánh dấu Done khi chưa có bằng chứng thực thi.</div>`}
function agentsPage(){return head('Role & Skill Studio','Một agent có thể nhiều role; role là hợp đồng công việc, skill là hành động, model chỉ là engine suy luận.',`<button class="btn primary" onclick="notify('Demo: role assignment chưa lưu thành cấu hình.')">＋ Add agent / role</button>`)+`<div class="notice" style="margin-bottom:15px">Ví dụ: Claude Coordinator dùng <b>BA + Leader</b> trong hai step độc lập. Tester, SOC và QA là quality gates với evidence riêng; không tự chứng nhận kết quả.</div><div class="panel"><div class="panelHead"><div><div class="panelTitle">Many-to-many Agent ↔ Role</div><div class="panelHint">Số role là dữ liệu mô phỏng; click Inspect để xem agent trong office</div></div></div><div class="listPanel">${people.map(p=>`<div class="listRow"><span class="person">${p.emoji}</span><span class="detail"><b>${p.name}</b><div class="roleChips">${(roleDemo[p.id]||['dev']).map(r=>`<span>/${r}</span>`).join('')}</div><small>${p.model} · ${p.skill}</small></span><button class="btn" data-select-agent="${p.id}">Inspect</button></div>`).join('')}</div></div>`}
function providersPage(){return head('Providers & Models','Cấu hình API theo provider, capability và policy; keys lưu trong OS vault.',`<button class="btn primary" onclick="notify('Prototype: không nhận API keys thật.')">＋ Add provider</button>`)+`<div class="notice">Trong sản phẩm thực, OpenAI / Claude / Gemini là cloud services: prompt/context được gửi đến provider khi được phép. Strict Local chỉ chạy Ollama/llama.cpp/local models.</div><div class="cols">${[['Ollama','Local inference',true],['OpenAI','Cloud · API',false],['Anthropic','Cloud · API',false],['Gemini','Cloud · API',false]].map(p=>`<div class="panel" style="padding:20px"><div style="display:flex;justify-content:space-between"><b style="font-size:15px">◈ ${p[0]}</b><span class="tag ${p[2]?'':'warning'}">${p[2]?'Local':'Disabled · Demo'}</span></div><p style="color:#9eacc4">${p[1]}</p><button class="btn" onclick="notify('Prototype: provider settings chỉ mang tính minh họa.')">Configuration</button></div>`).join('')}</div>`}
function securityPage(){return head('Storage & Privacy Center','File Store trên device hoặc Database Store tự cấu hình, độc lập với inference mode.',`<button class="btn" onclick="notify('Prototype chưa hỗ trợ backup, migration hay kết nối DB.')">Backup / Migrate</button>`)+`<div class="companyBanner"><div><b>LOCAL-FIRST · OWNER CONTROLLED</b><small>Dữ liệu mock của prototype không được lưu vào DB; chuyển tùy chọn bên dưới chỉ đổi minh họa giao diện.</small></div><span class="flag">PROTOTYPE ONLY</span></div><div class="cols"><div class="panel" style="padding:20px"><b style="font-size:14px">Storage Backend</b><p class="softInfo">Chọn kho dữ liệu dự kiến. File Store không cần cài DB server.</p><select class="selectDemo" aria-label="Storage mode" onchange="storageDemo=this.value;render()"><option value="files" ${storageDemo==='files'?'selected':''}>File Store · Local folder</option><option value="sqlite" ${storageDemo==='sqlite'?'selected':''}>SQLite · Local database</option><option value="postgres" ${storageDemo==='postgres'?'selected':''}>PostgreSQL · User configured</option></select><div class="miniMessage" style="margin-top:17px"><b>Chế độ: ${storageDemo==='files'?'File Store':storageDemo==='sqlite'?'SQLite':'External database'}</b><br>${storageDemo==='files'?'Events JSONL + snapshots + blobs + local indexes. Single-writer & recoverable.':storageDemo==='sqlite'?'DB nhúng SQLite + filesystem artifacts, không cần server riêng.':'Nếu DB nằm trên máy khác, dữ liệu sẽ được truyền đến máy chủ đó; không còn strict device-local.'}</div></div><div class="panel" style="padding:20px"><b style="font-size:14px">AI Inference & Network Boundary</b><div class="miniMessage" style="margin-top:15px"><b>Strict Local</b><br>Chỉ chạy local LLM và local tools, không outbound network, không CDN/telemetry.</div><div class="miniMessage"><b>Controlled Cloud</b><br>Người dùng cho phép theo tác vụ: kiểm tra payload, redaction, gửi một phần context tới provider API.</div><span class="tag warning">No API connectivity in this prototype</span></div></div><div class="notice" style="margin-top:16px">File Store, SQLite và external DB là lựa chọn storage; chúng không tự quyết định context có được gửi lên OpenAI/Claude/Gemini hay không. Chính sách outbound và API consent là cơ chế tách riêng.</div>`}
function render(){const views={office:officePage,overview:overviewPage,board:boardPage,chat:chatPage,workflow:workflowPage,knowledge:knowledgePage,tasks:tasksPage,agents:agentsPage,providers:providersPage,security:securityPage};document.getElementById('content').innerHTML=(views[current]||overviewPage)();bindCommon();document.querySelectorAll('[data-agent]').forEach(el=>{let select=()=>{selected=el.dataset.agent;render();};el.addEventListener('click',select);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});document.querySelectorAll('[data-select-agent]').forEach(el=>el.onclick=()=>{selected=el.dataset.selectAgent;go('office')});if(current==='office')officeRestoreAfterRender();}
document.getElementById('companySelect').onchange=(e)=>{company=e.target.value;selected='chief';go('overview');notify('Đã đổi company trong dữ liệu mock. Trong app thật, dữ liệu của từng company được cô lập.')};window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();notify('Global search ⌘K sẽ tìm nguồn, message, task và quyết định trong company.')} });navRender();render();
</script>
</body>
</html>
