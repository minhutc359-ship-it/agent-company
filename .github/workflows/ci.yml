name: Verify local workspace
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "*_test.py"
      - name: Verify Windows launcher without installing dependencies
        if: runner.os == 'Windows'
        run: cmd /c "setup\Setup-Windows.cmd --plan < nul"
      - run: dotnet restore tests/AICompanyOS.Runtime.Tests --locked-mode
      - run: dotnet build tests/AICompanyOS.Runtime.Tests -c Release --no-restore
      - name: Install the explicit sandbox fixture image (Linux)
        if: runner.os == 'Linux'
        run: docker pull node:22-alpine
      - run: dotnet run --project tests/AICompanyOS.Runtime.Tests -c Release --no-build
        env:
          AICOS_REQUIRE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: dotnet publish src/AICompanyOS.Runtime -c Release --no-restore --self-contained false -o "${{ runner.temp }}/aicos-runtime"
      - name: Initialize embedded SQLite and the actual demo from the published package
        run: dotnet "${{ runner.temp }}/aicos-runtime/AICompanyOS.Runtime.dll" --initialize-local
        env:
          AICOS_DATA_DIR: ${{ runner.temp }}/aicos-package-demo
      - run: python setup/build-bundle.py --runtime "${{ runner.temp }}/aicos-runtime" --output "${{ runner.temp }}/AICompanyOS-Full-Setup-2.5.zip"
      - name: Verify actual managed update and automatic rollback
        run: python tests/managed_update_integration.py --runtime "${{ runner.temp }}/aicos-runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-company-os-full-setup-2.5-${{ runner.os }}
          path: ${{ runner.temp }}/AICompanyOS-Full-Setup-2.5.zip
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: dotnet restore src/AICompanyOS.Runtime --locked-mode
      - run: dotnet build src/AICompanyOS.Runtime -c Release --no-restore
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Install the explicit browser sandbox fixture image
        run: docker pull node:22-alpine
      - run: npm run test:browser
        env:
          AICOS_QA_OUTPUT_DIR: ${{ runner.temp }}/aicos-qa
          AICOS_REQUIRE_SANDBOX: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            ${{ runner.temp }}/aicos-qa/*.png
            ${{ runner.temp }}/aicos-qa/*.json
          if-no-files-found: ignore

  publish:
    needs: [runtime, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-company-os-full-setup-2.5-Linux
          path: release-package
      - name: Publish verified stable update for the in-app updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python setup/publish-release.py --bundle release-package/AICompanyOS-Full-Setup-2.5.zip
